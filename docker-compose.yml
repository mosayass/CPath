version: '3.8'

services:
  inference-api:
    build: .
    container_name: fast_inference_api
    ports:
      - "8000:8000"
    volumes:
      # Syncs your local 'app' folder to the container
      # This allows you to edit code in VS Code and see changes instantly without rebuilding
      - ./models:/code/models
      - ./app:/code/app
    environment:
      - APP_ENV=development
    # restart: always  <-- Uncomment this for production
# This tells Docker to look for the network your C# app already created
networks:
  ai_shared_network:
    external: true
    name: ai_shared_network